[package]
name = "cwlogs-retention"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline CloudWatch Logs storage cost from describe-log-groups JSON"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/cwlogs-retention"
homepage = "https://www.pepai.nl"
documentation = "https://github.com/qwpp7g79y4-maker/cwlogs-retention"
keywords = ["aws", "cloudwatch", "logs", "cost", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/blueprint.md", "/task.md", "*-plugin/"]

[lib]
name = "cwlogs_retention"
path = "src/lib.rs"

[[bin]]
name = "cwlogs-retention"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rust_decimal = "1.43.0"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
